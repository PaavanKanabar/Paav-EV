<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alpha Monitor</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/dark_grey_square.png">

  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --surface-header: #1C1C1E;
      --surface-card: #2C2C2E;
      --text: #FFFFFF;
      --text-dim: #8E8E93;
      --accent: #0A84FF;
      --up: #30D158;
      --down: #FF453A;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Main View Styles */
    #main-view { display: block; }
    #detail-view { display: none; min-height: 100vh; background: var(--bg); }
    
    .header {
      padding: max(16px, env(safe-area-inset-top)) 16px 16px 16px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-nav { display: flex; align-items: center; gap: 10px; }
    .back-btn { color: var(--accent); font-size: 16px; cursor: pointer; display: flex; align-items: center; }
    .header h1 { margin: 0; font-size: 14px; font-weight: 700; }
    .header span { font-size: 12px; color: var(--text-dim); }
    
    .category { background: var(--surface-header); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #E5E5EA; }
    .group-header { background: var(--surface); padding: 8px 16px; display: flex; font-size: 10px; font-weight: 700; color: var(--text-dim); border-bottom: 1px solid #2C2C2E; }
    .group-title { color: var(--accent); flex: 2; }
    .col { flex: 1; text-align: right; }
    .row { display: flex; padding: 12px 16px; border-bottom: 1px solid #1C1C1E; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
    .row:active { background: #1C1C1E; }
    
    .ticker { flex: 2; display: flex; flex-direction: column; }
    .ticker-name { font-size: 14px; font-weight: 600; }
    .ticker-vol { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .price { flex: 1; text-align: right; font-family: "Menlo", monospace; font-size: 13px; color: #D1D1D6; }
    .ret, .outperf { flex: 1; text-align: right; font-family: "Menlo", monospace; font-size: 13px; font-weight: 600; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .neutral { color: #48484A; }
    #loading { padding: 20px; text-align: center; color: var(--text-dim); font-size: 14px; }

    /* Detail View Specific Styles */
    .detail-section { padding: 16px; border-bottom: 1px solid #1C1C1E; }
    .detail-title { font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; }
    
    .macro-strip { display: flex; gap: 12px; }
    .macro-card { flex: 1; background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--surface-card); }
    .macro-card-title { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
    .macro-card-val { font-family: "Menlo", monospace; font-size: 16px; font-weight: 700; }

    .basis-card { background: var(--surface); border: 1px solid var(--surface-card); border-radius: 8px; padding: 16px; text-align: center; }
    .basis-label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 8px; }
    .basis-spread { font-family: "Menlo", monospace; font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .basis-sub { font-size: 12px; color: #D1D1D6; }

    .imbalance-container { display: flex; height: 8px; width: 100%; border-radius: 4px; overflow: hidden; margin-top: 8px; background: #333; }
    .imb-bid { background: var(--up); height: 100%; transition: width 0.2s ease-out; }
    .imb-ask { background: var(--down); height: 100%; transition: width 0.2s ease-out; }
    .imbalance-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-top: 4px; font-family: "Menlo", monospace; }

  </style>
</head>
<body>

  <!-- MAIN LIST VIEW -->
  <div id="main-view">
    <div class="header">
      <h1>HYPERLIQUID DESK</h1>
      <span>vs 4 PM EST</span>
    </div>
    <div id="loading">Syncing order books...</div>
    <div id="content"></div>
  </div>

  <!-- SOXL DETAIL VIEW -->
  <div id="detail-view">
    <div class="header">
      <div class="header-nav">
        <div class="back-btn" onclick="closeDetail()">‹ Back</div>
        <h1>SOXL ANALYSIS</h1>
      </div>
      <span>Live Delta</span>
    </div>
    
    <div class="detail-section">
      <div class="detail-title">Macro Context</div>
      <div class="macro-strip">
        <div class="macro-card">
          <div class="macro-card-title">NASDAQ (XYZ100)</div>
          <div class="macro-card-val neutral" id="dt-xyz100">-</div>
        </div>
        <div class="macro-card">
          <div class="macro-card-title">S&P 500 (US500)</div>
          <div class="macro-card-val neutral" id="dt-us500">-</div>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-title">Basis (Rich/Cheap Monitor)</div>
      <div class="basis-card">
        <div class="basis-label">SOXL vs ORACLE SPREAD</div>
        <div class="basis-spread neutral" id="dt-basis">0.00%</div>
        <div class="basis-sub">
          Live Mid: <span id="dt-soxl-live" style="font-family: Menlo">-</span> | 
          Oracle (Fair Value): <span id="dt-soxl-oracle" style="font-family: Menlo">-</span>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-title">L2 Microstructure (Top 5 Levels)</div>
      <div class="basis-card" style="padding: 12px;">
        <div class="imbalance-container">
          <div class="imb-bid" id="dt-bid-bar" style="width: 50%;"></div>
          <div class="imb-ask" id="dt-ask-bar" style="width: 50%;"></div>
        </div>
        <div class="imbalance-labels">
          <span id="dt-bid-sz">Bids: 0</span>
          <span id="dt-ask-sz">Asks: 0</span>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-title">Index Heavyweights</div>
      <div id="heavyweights-list">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <script>
    const url = "https://api.hyperliquid.xyz/info";
    const wsUrl = "wss://api.hyperliquid.xyz/ws";
    const DEX_LIST = ["xyz", "para", "mkts", "io", ""];
    let marketMap = {};
    let activeKeys = new Set();
    let isDirty = false;
    let currentView = "main"; 
    
    // L2 Imbalance state for SOXL
    let soxlL2 = { bidSz: 0, askSz: 0 };

    const taxonomy = [
      { category: "MACRO", subgroups: [
        { name: "Equity Indices", tickers: ["US500", "QQQ", "IWM", "XYZ100"] },
        { name: "Commodities & Rates", tickers: ["NATGAS", "COPPER", "CL", "WTIOIL", "GOLD", "TLT"] }
      ]},
      { category: "THEMATICS", subgroups: [
        { name: "Semiconductors & Equipment", tickers: ["NVDA", "AMD", "TSM", "AVGO", "INTC", "MU", "SOXL"] },
        { name: "AI & Mega-Cap Tech", tickers: ["AAPL", "GOOGL", "META", "AMZN", "MSFT", "PLTR"] },
        { name: "Crypto & On-Chain", tickers: ["MSTR", "COIN", "IREN", "HOOD"] }
      ]}
    ];

    const hwTickers = ["NVDA", "AMD", "MU", "AVGO", "INTC", "TSM"];

    taxonomy.forEach(s => s.subgroups.forEach(g => g.tickers.forEach(t => activeKeys.add(t.toUpperCase()))));

    function formatVolume(val) {
      if (!val || isNaN(val)) return "$0";
      let num = parseFloat(val);
      if (num >= 1e9) return "$" + (num / 1e9).toFixed(1) + "B";
      if (num >= 1e6) return "$" + (num / 1e6).toFixed(1) + "M";
      if (num >= 1e3) return "$" + (num / 1e3).toFixed(0) + "K";
      return "$" + num.toFixed(0);
    }

    function getLastUSCloseMs() {
      let now = new Date();
      for (let daysBack = 0; daysBack < 7; daysBack++) {
        let testDate = new Date(now.getTime() - (daysBack * 24 * 60 * 60 * 1000));
        let nyStr = testDate.toLocaleString("en-US", { timeZone: "America/New_York", hour12: false });
        let [datePart, timePart] = nyStr.split(", ");
        let [m, d, y] = datePart.split("/");
        let hr = parseInt(timePart.split(":")[0]);
        let dayOfWeek = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
        
        if (daysBack === 0 && hr < 16) continue;
        if (dayOfWeek === 0 || dayOfWeek === 6) continue;
        
        for (let utcHour = 19; utcHour <= 22; utcHour++) {
           let exactMs = Date.UTC(y, m - 1, d, utcHour, 0, 0);
           let exactNyHr = parseInt(new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", hour: "numeric", hour12: false}).format(new Date(exactMs)));
           if (exactNyHr === 16) return exactMs;
        }
      }
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function cacheDOMPointers() {
      for (const key of activeKeys) {
        if (marketMap[key]) {
          marketMap[key].elPx = document.getElementById(`px-${key}`);
          marketMap[key].elRet = document.getElementById(`ret-${key}`);
          marketMap[key].elOutperf = document.getElementById(`outperf-${key}`);
          marketMap[key].elDtPx = document.getElementById(`dt-px-${key}`);
          marketMap[key].elDtRet = document.getElementById(`dt-ret-${key}`);
        }
      }
    }

    function openSoxlView(e) {
      if (e) e.preventDefault();
      document.getElementById("main-view").style.display = "none";
      document.getElementById("detail-view").style.display = "block";
      currentView = "soxl";
      isDirty = true;
      flushUpdatesToDOM();
      window.scrollTo(0,0);
    }

    function closeDetail() {
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("main-view").style.display = "block";
      currentView = "main";
      isDirty = true;
      flushUpdatesToDOM();
    }

    function flushUpdatesToDOM() {
      if (!isDirty) return;
      isDirty = false;

      for (const key of activeKeys) {
        let item = marketMap[key];
        if (!item) continue;
        if (item.closePrice) {
          item.rawPct = ((item.livePrice - item.closePrice) / item.closePrice) * 100;
        }
      }

      if (currentView === "main") {
        for (const key of activeKeys) {
          let item = marketMap[key];
          if (!item || !item.elPx || !item.elRet) continue;
          
          let retVal = item.rawPct;
          let outperfVal = null;
          if (item.baseName === "SOXL") {
            retVal = item.rawPct / 3;
            if (marketMap["XYZ100"]) outperfVal = retVal - (marketMap["XYZ100"].rawPct * 2);
          }

          let pxStr = item.livePrice >= 1000 ? item.livePrice.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : (item.livePrice < 10 ? item.livePrice.toFixed(3) : item.livePrice.toFixed(2));
          if (item.elPx.innerText !== `$${pxStr}`) item.elPx.innerText = `$${pxStr}`;

          let rClass = retVal >= 0 ? "up" : "down";
          let rSign = retVal >= 0 ? "+" : "";
          let rStr = `${rSign}${retVal.toFixed(2)}%`;
          if (item.elRet.innerText !== rStr) {
            item.elRet.className = `ret ${rClass}`;
            item.elRet.innerText = rStr;
          }

          if (item.elOutperf) {
            if (outperfVal !== null) {
              let oClass = outperfVal >= 0 ? "up" : "down";
              let oSign = outperfVal >= 0 ? "+" : "";
              item.elOutperf.className = `outperf ${oClass}`;
              item.elOutperf.innerText = `${oSign}${outperfVal.toFixed(2)}%`;
            }
          }
        }
      } 
      else if (currentView === "soxl") {
        let macroKeys = ["XYZ100", "US500"];
        macroKeys.forEach(k => {
          let m = marketMap[k];
          if (m) {
            let el = document.getElementById(`dt-${k.toLowerCase()}`);
            let cls = m.rawPct >= 0 ? "up" : "down";
            let sgn = m.rawPct >= 0 ? "+" : "";
            el.className = `macro-card-val ${cls}`;
            el.innerText = `${sgn}${m.rawPct.toFixed(2)}%`;
          }
        });

        // Updated Basis Math: Live Price vs Oracle
        let soxl = marketMap["SOXL"];
        
        if (soxl && soxl.oraclePrice) {
           let basis = ((soxl.livePrice / soxl.oraclePrice) - 1) * 100;

           let bsEl = document.getElementById("dt-basis");
           let bsCls = basis > 0.15 ? "down" : (basis < -0.15 ? "up" : "neutral"); 
           let bsSgn = basis >= 0 ? "+" : "";
           
           bsEl.className = `basis-spread ${bsCls}`;
           bsEl.innerText = `${bsSgn}${basis.toFixed(2)}%`;

           document.getElementById("dt-soxl-live").innerText = `$${soxl.livePrice.toFixed(2)}`;
           document.getElementById("dt-soxl-oracle").innerText = `$${soxl.oraclePrice.toFixed(2)}`;
        }

        let totalSz = soxlL2.bidSz + soxlL2.askSz;
        if (totalSz > 0) {
           let bidPct = (soxlL2.bidSz / totalSz) * 100;
           let askPct = (soxlL2.askSz / totalSz) * 100;
           document.getElementById("dt-bid-bar").style.width = `${bidPct}%`;
           document.getElementById("dt-ask-bar").style.width = `${askPct}%`;
           document.getElementById("dt-bid-sz").innerText = `Bids: ${soxlL2.bidSz.toFixed(0)}`;
           document.getElementById("dt-ask-sz").innerText = `Asks: ${soxlL2.askSz.toFixed(0)}`;
        }

        hwTickers.forEach(k => {
           let item = marketMap[k];
           if (item && item.elDtPx && item.elDtRet) {
              let pxStr = item.livePrice >= 1000 ? item.livePrice.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : (item.livePrice < 10 ? item.livePrice.toFixed(3) : item.livePrice.toFixed(2));
              let rClass = item.rawPct >= 0 ? "up" : "down";
              let rSign = item.rawPct >= 0 ? "+" : "";
              
              if(item.elDtPx.innerText !== `$${pxStr}`) item.elDtPx.innerText = `$${pxStr}`;
              let rStr = `${rSign}${item.rawPct.toFixed(2)}%`;
              if(item.elDtRet.innerText !== rStr) {
                 item.elDtRet.className = `ret ${rClass}`;
                 item.elDtRet.innerText = rStr;
              }
           }
        });
      }
    }

    function connectWebSocket() {
      const ws = new WebSocket(wsUrl);
      
      ws.onopen = async () => {
        let coinsToSub = new Set();
        for (const key of activeKeys) {
           let item = marketMap[key];
           if (item && item.fullName) coinsToSub.add(item.fullName);
        }
        
        for (const coin of coinsToSub) {
            ws.send(JSON.stringify({ method: "subscribe", subscription: { type: "l2Book", coin: coin } }));
            await sleep(10); 
        }
      };
      
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.channel === "l2Book" && msg.data) {
           const coin = msg.data.coin;
           const levels = msg.data.levels;
           
           if (levels && levels[0] && levels[1] && levels[0].length > 0 && levels[1].length > 0) {
               const bestBid = parseFloat(levels[0][0].px);
               const bestAsk = parseFloat(levels[1][0].px);
               const mid = (bestBid + bestAsk) / 2;
               
               let baseName = coin.includes(":") ? coin.split(":")[1] : coin;
               let item = marketMap[baseName.toUpperCase()];
               
               if (item && item.livePrice !== mid) {
                   item.livePrice = mid;
                   isDirty = true;
               }

               if (baseName.toUpperCase() === "SOXL") {
                  let bSz = 0; let aSz = 0;
                  for(let i=0; i<Math.min(5, levels[0].length); i++) bSz += parseFloat(levels[0][i].sz);
                  for(let i=0; i<Math.min(5, levels[1].length); i++) aSz += parseFloat(levels[1][i].sz);
                  if (soxlL2.bidSz !== bSz || soxlL2.askSz !== aSz) {
                     soxlL2.bidSz = bSz;
                     soxlL2.askSz = aSz;
                     isDirty = true;
                  }
               }
           }
        }
      };
      ws.onclose = () => setTimeout(connectWebSocket, 1000);
    }

    // New Background Poller specifically to keep Oracle Prices updated
    async function pollOraclePrices() {
      while (true) {
        await sleep(5000); // Polling every 5 seconds is plenty for oracle updates
        const fetchDexOracle = async (dex) => {
          let payload = { type: "metaAndAssetCtxs" };
          if (dex) payload.dex = dex;
          try {
            let res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            let data = await res.json();
            if (data && data[0] && data[1]) {
              let universe = data[0].universe;
              let ctxs = data[1];
              for (let i = 0; i < universe.length; i++) {
                let uName = universe[i].name;
                let oracle = parseFloat(ctxs[i].oraclePx || ctxs[i].markPx || 0);
                let item = marketMap[uName.toUpperCase()];
                if (item && item.oraclePrice !== oracle) {
                   item.oraclePrice = oracle;
                   isDirty = true;
                }
              }
            }
          } catch(e) {}
        };
        await Promise.all(DEX_LIST.map(fetchDexOracle));
      }
    }

    async function initDashboard() {
      const lastCloseMs = getLastUSCloseMs();
      const cacheKey = `hl_close_cache_${lastCloseMs}`;
      let cachedCloses = JSON.parse(localStorage.getItem(cacheKey) || "{}");
      
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith("hl_close_cache_") && key !== cacheKey) localStorage.removeItem(key);
      });

      // Added oraclePrice parsing to the initial fetch
      const fetchDex = async (dex) => {
        let payload = { type: "metaAndAssetCtxs" };
        if (dex) payload.dex = dex;
        try {
          let res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          let data = await res.json();
          if (data && data[0] && data[1]) {
            let universe = data[0].universe;
            let ctxs = data[1];
            for (let i = 0; i < universe.length; i++) {
              let uName = universe[i].name;
              let base = uName.includes(":") ? uName.split(":")[1] : uName;
              let mark = parseFloat(ctxs[i].markPx || 0);
              let prev = parseFloat(ctxs[i].prevDayPx || mark);
              let oracle = parseFloat(ctxs[i].oraclePx || mark);
              
              let entry = { 
                fullName: uName, 
                baseName: base, 
                livePrice: mark, 
                oraclePrice: oracle, 
                volume: parseFloat(ctxs[i].dayNtlVlm || 0), 
                rawPct: 0, 
                closePrice: prev 
              };
              marketMap[uName.toUpperCase()] = entry;
              marketMap[base.toUpperCase()] = entry;
            }
          }
        } catch(e) {}
      };
      
      await Promise.all(DEX_LIST.map(fetchDex));

      let needsCacheUpdate = false;
      document.getElementById("loading").innerText = "Syncing baselines...";

      for (let base of activeKeys) {
        let asset = marketMap[base];
        if (!asset) continue;
        if (cachedCloses[base]) {
          asset.closePrice = cachedCloses[base];
          asset.rawPct = ((asset.livePrice - asset.closePrice) / asset.closePrice) * 100;
        } else {
          try {
            await sleep(50);
            let res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
              type: "candleSnapshot", req: { coin: asset.fullName, interval: "15m", startTime: lastCloseMs - (15 * 60 * 1000), endTime: lastCloseMs + (60 * 1000) }
            })});
            let hist = await res.json();
            if (hist && hist.length > 0) {
              let cPrice = parseFloat(hist[hist.length - 1].c);
              asset.closePrice = cPrice;
              asset.rawPct = ((asset.livePrice - cPrice) / cPrice) * 100;
              cachedCloses[base] = cPrice;
              needsCacheUpdate = true;
            }
          } catch(e) {}
        }
      }

      if (needsCacheUpdate) localStorage.setItem(cacheKey, JSON.stringify(cachedCloses));

      let mainHtml = "";
      for (let section of taxonomy) {
        mainHtml += `<div class="category">${section.category}</div>`;
        for (let group of section.subgroups) {
          let rowData = [];
          let seen = new Set();
          for (let sym of group.tickers) {
            let item = marketMap[sym.toUpperCase()];
            if (item && !seen.has(item.baseName)) { seen.add(item.baseName); rowData.push(item); }
          }
          if (rowData.length === 0) continue;
          rowData.sort((a, b) => b.volume - a.volume);
          
          mainHtml += `
            <div class="group-header">
              <div class="group-title">${group.name.toUpperCase()}</div>
              <div class="col">PRICE</div>
              <div class="col">1x RET</div>
              <div class="col">OUTPERF</div>
            </div>
          `;
          
          for (let item of rowData) {
            let onClickAction = item.baseName === "SOXL" ? `onclick="openSoxlView(event)"` : `href="https://app.hyperliquid.xyz/trade/${item.fullName}" target="_blank"`;
            let tag = item.baseName === "SOXL" ? "div" : "a";
            
            mainHtml += `
              <${tag} ${onClickAction} class="row">
                <div class="ticker">
                  <span class="ticker-name">${item.baseName}</span>
                  <span class="ticker-vol">${formatVolume(item.volume)} 24h</span>
                </div>
                <div class="price" id="px-${item.baseName}">-</div>
                <div class="ret" id="ret-${item.baseName}">-</div>
                <div class="outperf" id="outperf-${item.baseName}">-</div>
              </${tag}>
            `;
          }
        }
      }
      
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").innerHTML = mainHtml;

      let hwHtml = "";
      hwTickers.forEach(k => {
         let item = marketMap[k];
         if (item) {
             hwHtml += `
              <a href="https://app.hyperliquid.xyz/trade/${item.fullName}" target="_blank" class="row">
                <div class="ticker"><span class="ticker-name">${item.baseName}</span></div>
                <div class="price" id="dt-px-${item.baseName}">-</div>
                <div class="ret" id="dt-ret-${item.baseName}">-</div>
              </a>
             `;
         }
      });
      document.getElementById("heavyweights-list").innerHTML = hwHtml;

      cacheDOMPointers();
      isDirty = true; 
      flushUpdatesToDOM();
